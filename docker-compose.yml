services:
  promobot:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # banco SQLite + perfis do navegador persistem
      - ./.env:/app/.env      # afiliados etc. editáveis pelo painel
    restart: unless-stopped
    init: true             # repassa sinais e recolhe processos filhos do navegador
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
